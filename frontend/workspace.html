<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace — HindiOCRExcel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="workspace-body">
  <nav class="navbar navbar-expand-lg sticky-top shadow-sm app-navbar">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="/"><i class="bi bi-table text-primary"></i> HindiOCR<span class="text-primary">Excel</span></a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="/" class="btn btn-sm btn-outline-secondary"><i class="bi bi-house"></i> Home</a>
        <button id="themeToggle" class="btn btn-sm btn-outline-secondary" title="Toggle theme"><i class="bi bi-moon-stars"></i></button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">
    <!-- Upload bar (shown when no file loaded) -->
    <div id="uploadBar" class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <div id="dropZone" class="drop-zone drop-zone-sm">
          <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.pdf" hidden />
          <i class="bi bi-cloud-arrow-up-fill drop-icon"></i>
          <p class="mb-1 fw-semibold">Drop an image or PDF, or</p>
          <button class="btn btn-primary btn-sm" id="browseBtn"><i class="bi bi-folder2-open"></i> Browse files</button>
          <div class="progress mt-3 d-none" id="uploadProgress" style="height:6px;max-width:320px;margin:auto;">
            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:0%"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <!-- Left: preview -->
      <div class="col-lg-5">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
            <span class="fw-semibold"><i class="bi bi-image"></i> Document</span>
            <div class="btn-group btn-group-sm" role="group">
              <button class="btn btn-outline-secondary" id="zoomOut" title="Zoom out"><i class="bi bi-zoom-out"></i></button>
              <button class="btn btn-outline-secondary" id="zoomIn" title="Zoom in"><i class="bi bi-zoom-in"></i></button>
              <button class="btn btn-outline-secondary" id="rotateLeft" title="Rotate left"><i class="bi bi-arrow-counterclockwise"></i></button>
              <button class="btn btn-outline-secondary" id="rotateRight" title="Rotate right"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
          </div>
          <div class="card-body">
            <div id="pdfPager" class="d-none mb-2 d-flex align-items-center justify-content-center gap-2">
              <button class="btn btn-sm btn-outline-secondary" id="prevPage"><i class="bi bi-chevron-left"></i></button>
              <span class="small text-secondary" id="pageLabel">Page 1</span>
              <button class="btn btn-sm btn-outline-secondary" id="nextPage"><i class="bi bi-chevron-right"></i></button>
            </div>
            <div class="preview-viewport" id="previewViewport">
              <div class="text-center text-secondary py-5" id="previewEmpty">
                <i class="bi bi-file-earmark-image fs-1"></i>
                <p class="mt-2 mb-0">No document loaded</p>
              </div>
              <img id="docImage" class="doc-image d-none" alt="document" />
            </div>
          </div>
        </div>
      </div>

      <!-- Right: table + controls -->
      <div class="col-lg-7">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-transparent">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
              <span class="fw-semibold"><i class="bi bi-table"></i> Extracted table</span>
              <div class="d-flex align-items-center gap-2">
                <span class="badge text-bg-light d-none" id="confBadge">confidence: —</span>
                <span class="badge text-bg-light d-none" id="timeBadge">—</span>
              </div>
            </div>
          </div>

          <div class="card-body">
            <!-- OCR progress -->
            <div id="ocrStatus" class="alert alert-info d-none align-items-center gap-2" role="alert">
              <span class="spinner-border spinner-border-sm"></span>
              <span id="ocrStatusText">Running OCR…</span>
            </div>

            <!-- Toolbar -->
            <div id="tableToolbar" class="d-none flex-wrap gap-2 mb-3">
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-primary" id="addRow" title="Add row"><i class="bi bi-plus-square"></i> Row</button>
                <button class="btn btn-outline-primary" id="addCol" title="Add column"><i class="bi bi-plus-square-dotted"></i> Col</button>
              </div>
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-danger" id="delRow" title="Delete selected row"><i class="bi bi-dash-square"></i> Row</button>
                <button class="btn btn-outline-danger" id="delCol" title="Delete selected column"><i class="bi bi-dash-square-dotted"></i> Col</button>
              </div>
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-secondary" id="undoBtn" title="Undo (Ctrl+Z)"><i class="bi bi-arrow-90deg-left"></i></button>
                <button class="btn btn-outline-secondary" id="redoBtn" title="Redo (Ctrl+Y)"><i class="bi bi-arrow-90deg-right"></i></button>
              </div>
              <button class="btn btn-outline-secondary btn-sm" id="clearCell" title="Clear selected cell"><i class="bi bi-eraser"></i> Clear</button>
              <div class="input-group input-group-sm search-box ms-auto">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="searchInput" placeholder="Search…" />
              </div>
            </div>

            <div class="table-scroll" id="tableScroll">
              <div class="text-center text-secondary py-5" id="tableEmpty">
                <i class="bi bi-table fs-1"></i>
                <p class="mt-2 mb-0">Upload and extract a document to see the table here.</p>
              </div>
              <table class="table table-bordered table-sm editable-table d-none" id="dataTable">
                <thead></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>

          <div class="card-footer bg-transparent d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span class="text-secondary small" id="tableStats">—</span>
            <div class="d-flex gap-2">
              <input class="form-control form-control-sm" id="exportName" style="max-width:180px" placeholder="filename" value="hindi_ocr_export" />
              <button class="btn btn-success btn-sm" id="exportBtn" disabled><i class="bi bi-file-earmark-excel"></i> Export Excel</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/table.js"></script>
  <script src="/static/js/export.js"></script>
  <script src="/static/js/crop.js"></script>
  <script src="/static/js/upload.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
